<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Application</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        .card { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .page { display: none; } /* Hides all pages by default */
        .active { display: block; } /* Shows the current step */
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { padding: 10px 14px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .back-link { color: #666; text-decoration: none; font-size: 14px; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <div id="login-step" class="page active">
        <h2>Login</h2>
        <input type="text" placeholder="Username" id="user">
        <input type="password" placeholder="Password">
        <button onclick="navigate('dashboard-step')">Login</button>
    </div>

    <div id="dashboard-step" class="page">
        <h2>Dashboard</h2>
        <p>Welcome! Select a room to manage.</p>
        <button onclick="navigate('room-step')">Go to Room 1</button>
        <br><br>
        <a href="#" onclick="navigate('login-step')">Logout</a>
    </div>

    <div id="room-step" class="page">
        <a href="#" class="back-link" onclick="navigate('dashboard-step')">← Back to Dashboard</a>
        <h2>Room Control</h2>
        <div style="border: 1px dashed #ccc; padding: 15px;">
            <h3>Lights</h3>
            <button>L1</button> <button>L2</button>
            <h3>AC</h3>
            <button>ON/OFF</button>
        </div>
    </div>
</div>

<script>
    // The "Step-by-Step" logic
    function navigate(nextStepId) {
        // 1. Hide all sections
        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });
        
        // 2. Show the requested section
        document.getElementById(nextStepId).classList.add('active');
    }
</script>

</body>
</html>
