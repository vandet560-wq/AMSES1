<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Home App</title>
    <style>
        /* Shared styles from your base.html */
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f2f5; }
        .card { max-width: 420px; padding: 20px; border: 1px solid #ddd; border-radius: 10px; background: white; margin: auto; }
        .page { display: none; } /* Hide all pages */
        .active { display: block; } /* Show only the active page */
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { padding: 10px 14px; cursor: pointer; background: #2446ff; color: white; border: none; border-radius: 8px; font-weight: bold; width: 100%; }
        .back-link { display: inline-block; margin-bottom: 8px; text-decoration: none; color: #6b3fa0; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div id="login-page" class="page active">
        <h2>Login</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button onclick="showPage('dashboard-page')">Login</button>
    </div>

    <div id="dashboard-page" class="page">
        <h2>Dashboard</h2>
        <p>Welcome, User! 🎉</p>
        <button onclick="showPage('room-page')">Go to Room 1</button>
        <p><a href="#" onclick="showPage('login-page')">Logout</a></p>
    </div>

    <div id="room-page" class="page">
        <span class="back-link" onclick="showPage('dashboard-page')">← Back</span>
        <h2>Room Control</h2>
        <div style="padding: 10px; border: 1px solid #eee; border-radius: 10px;">
            <h3>Lights</h3>
            <button style="width: 45%; margin-bottom: 5px;">L1</button>
            <button style="width: 45%; margin-bottom: 5px;">L2</button>
            <h3>AC</h3>
            <button>ON / OFF</button>
        </div>
    </div>
</div>

<script>
    // The "Step-by-Step" navigation logic
    function showPage(pageId) {
        // Hide all elements with the class 'page'
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        // Show the one page we want
        document.getElementById(pageId).classList.add('active');
    }
</script>

</body>
</html>
